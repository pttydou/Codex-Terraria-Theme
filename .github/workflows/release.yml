name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - id: version
        name: Validate version and tag
        shell: bash
        run: |
          version="$(tr -d '[:space:]' < macos/VERSION)"
          node release/validate-release.mjs --tag "$GITHUB_REF_NAME"
          printf 'value=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create or reuse draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if state="$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [[ "$state" == "true" ]] || { echo 'Refusing to overwrite a published Release.' >&2; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --draft \
              --title "TRSkin ${{ steps.version.outputs.value }} for macOS" \
              --notes "Build in progress from commit $GITHUB_SHA."
          fi
      - name: Download, verify, and stage pinned Music Pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(node -p "require('./release/release-config.json').music.sourceTag")"
          asset="$(node -p "require('./release/release-config.json').music.assetName")"
          expected="$(node -p "require('./release/release-config.json').music.sha256")"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir music
          printf '%s  %s\n' "$expected" "music/$asset" | sha256sum -c -
          gh release upload "$GITHUB_REF_NAME" "music/$asset" \
            --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    needs: prepare
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Download and verify pinned Music Pack
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$(node -p "require('./release/release-config.json').music.sourceTag")"
          asset="$(node -p "require('./release/release-config.json').music.assetName")"
          expected="$(node -p "require('./release/release-config.json').music.sha256")"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir music
          printf '%s  %s\n' "$expected" "music/$asset" | shasum -a 256 -c -
      - name: Build macOS packages
        run: |
          bash release/build-macos.sh \
            '${{ needs.prepare.outputs.version }}' \
            dist \
            '${{ github.sha }}' \
            music/TRSkin-Music-Pack.zip
      - name: Attest macOS packages
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: dist/*.zip
      - name: Upload macOS packages to draft Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    needs: [prepare, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Read draft Release asset digests
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_id="$(gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > release.json
      - name: Generate update manifest and checksums
        run: |
          node release/generate-release-metadata.mjs \
            release.json dist '${{ needs.prepare.outputs.version }}' \
            "$GITHUB_REF_NAME" '${{ github.sha }}'
      - name: Attest manifest and checksums
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4
        with:
          subject-path: |
            dist/SHA256SUMS.txt
            dist/update-manifest.json
      - name: Upload metadata and publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/SHA256SUMS.txt dist/update-manifest.json \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "TRSkin ${{ needs.prepare.outputs.version }} for macOS" \
            --notes-file dist/RELEASE-NOTES.md \
            --draft=false
