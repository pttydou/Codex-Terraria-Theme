name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release identity
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            node release/validate-release.mjs --tag "$GITHUB_REF_NAME"
          else
            node release/validate-release.mjs
          fi
      - name: Test release metadata
        run: node --test release/tests/*.test.mjs
      - name: Validate shell syntax
        shell: bash
        run: |
          find macos release -type f \( -name '*.sh' -o -name '*.command' \) -print0 \
            | xargs -0 -n1 bash -n
      - name: Prepare isolated browser test dependency
        run: npm install --prefix "$RUNNER_TEMP/trskin-browser" --ignore-scripts --no-audit --no-fund playwright-core@1.57.0
      - name: Run macOS source and browser checkup
        shell: bash
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/trskin-browser/node_modules/playwright-core/index.mjs
          CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          status=0
          (cd macos && npm run checkup -- --offline --output-root "$RUNNER_TEMP/trskin-checkup") || status=$?
          # Offline checks deliberately leave real Codex interaction untested (exit 2).
          if [[ "$status" != 2 ]]; then
            find "$RUNNER_TEMP/trskin-checkup" -name '*.log' -exec cat {} +
            exit 1
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import assert from 'node:assert/strict';
          const root = path.join(process.env.RUNNER_TEMP, 'trskin-checkup');
          const reports = fs.readdirSync(root);
          assert.equal(reports.length, 1);
          const report = JSON.parse(fs.readFileSync(path.join(root, reports[0], 'report.json'), 'utf8'));
          for (const id of ['source', 'browser', 'consistency']) {
            assert.equal(report.checks.find(check => check.id === id)?.status, 'pass', id);
          }
          assert.equal(report.offline, true);
          assert.equal(report.exitCode, 2);
          console.log(JSON.stringify(report.checks, null, 2));
          NODE

  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile native control panel
        run: macos/scripts/build-theme-console-binary-macos.sh "$RUNNER_TEMP/CodexThemeConsole"
      - name: Verify code signature
        run: |
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/CodexThemeConsole"
          codesign --verify --strict "$RUNNER_TEMP/CodexThemeConsole"
