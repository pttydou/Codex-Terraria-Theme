name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  source-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate release identity
        run: node release/validate-release.mjs
      - name: Run cross-platform source tests
        shell: bash
        run: bash macos/tests/run-tests.sh
      - name: Run Windows-native source tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./windows/tests/run-tests.ps1
      - name: Validate shell syntax
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find macos release -type f \( -name '*.sh' -o -name '*.command' \) -print0 \
            | xargs -0 -n1 bash -n
      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem windows,release -Recurse -File -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            )
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List
            throw "PowerShell syntax validation failed."
          }

  macos-native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Compile native control panel
        run: macos/scripts/build-theme-console-binary-macos.sh "$RUNNER_TEMP/CodexThemeConsole"
      - name: Verify code signature
        run: |
          codesign --force --sign - --timestamp=none "$RUNNER_TEMP/CodexThemeConsole"
          codesign --verify --strict "$RUNNER_TEMP/CodexThemeConsole"
